<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter confirm a request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Barlow, system-ui, sans-serif">
  <dc-import name="GuideSheet" theme="{{theme}}" contact="unlocked" hint-size="390px,844px"></dc-import>
  <a href="{{l.back}}" aria-label="Close" style="position: absolute; inset: 0; background: rgba(5,9,7,0.6)"></a>
  <section aria-labelledby="confirm-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{c.sheet}}; color: {{c.text}}; border-radius: 28px 28px 0 0; padding: 10px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 32px; height: 4px; border-radius: 999px; background: {{c.handle}}; margin-bottom: 4px"></span>
    <h2 id="confirm-title" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1">Send your request?</h2>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 600">Black bear over bait</span>
      <span style="font-size: 15px; color: {{c.muted}}">Your trip: May 18 to 21, 2027 · 4 days</span>
    </div>
    <div style="background: {{c.card}}; border: 1px solid {{c.border}}; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: {{c.muted}}">Shared with the guide</span>
        <a href="{{l.contact}}" style="min-height: 44px; margin: -12px -8px; padding: 0 8px; display: flex; align-items: center; color: {{c.green}}; font-size: 15px; font-weight: 600; text-decoration: none">Edit</a>
      </div>
      <span style="font-size: 16px; font-weight: 600">Alex Tremblay</span>
      <span style="font-size: 15px">alex.t@example.com</span>
      <span style="font-size: 15px">+1 418 555 0199</span>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: {{c.muted}}">The guide sees these details and contacts you. You can cancel in My requests.</p>
    <a href="{{l.sent}}" style="height: 52px; border-radius: 14px; background: {{c.primary}}; color: #1A0E05; font: 600 17px Barlow, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center">Send request</a>
    <a href="{{l.back}}" style="height: 44px; margin-top: -4px; color: {{c.green}}; font: 600 16px Barlow, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center">Not now</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const light = theme === 'light';
    const c = light
      ? {sheet:'#F5F2EA', card:'#FFFFFF', text:'#17201A', muted:'#5B6659', green:'#2F6B3E', primary:'#E8691E', border:'#E6E1D5', handle:'#C9C2B2'}
      : {sheet:'#17221A', card:'#1C2920', text:'#EEF1EA', muted:'#A9B5AB', green:'#8FD19E', primary:'#F27B2B', border:'#24352A', handle:'#3A4B3F'};
    const sfx = light ? 'Light' : '';
    return {theme, c, l: {back: 'SheetUnlocked' + sfx + '.dc.html', sent: 'SheetSent' + sfx + '.dc.html', contact: 'MyContact' + sfx + '.dc.html'}};
  }
}
</script>
</body>
</html>
