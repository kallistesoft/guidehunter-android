<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter dates picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Barlow, system-ui, sans-serif">
  <dc-import name="Main" theme="{{theme}}" mode="all" hint-size="390px,844px"></dc-import>
  <a href="{{l.map}}" aria-label="Close" style="position: absolute; inset: 0; background: rgba(5,9,7,0.55)"></a>
  <section role="dialog" aria-labelledby="dates-dialog-title" style="position: absolute; left: 24px; right: 24px; top: 150px; background: {{c.dialog}}; color: {{c.text}}; border-radius: 28px; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 8px">
    <span id="dates-dialog-title" style="font-size: 14px; font-weight: 600; color: {{c.muted}}; padding-left: 4px">When can you go?</span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 26px; padding-left: 4px">May 18 – 31, 2027</span>
    <div style="height: 1px; background: {{c.border}}; margin: 4px -20px"></div>
    <span style="font-size: 15px; font-weight: 600; padding: 4px 4px 0">May 2027</span>
    <div role="grid" aria-label="May 2027" style="display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center">
      <sc-for list="{{weekdays}}" as="wd" hint-placeholder-count="7">
        <span style="height: 32px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: {{c.muted}}">{{wd}}</span>
      </sc-for>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <span role="gridcell" style="height: 40px; display: flex; align-items: center; justify-content: center; background: {{d.band}}; border-radius: {{d.bandRadius}}">
          <span style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: {{d.bg}}; color: {{d.color}}; font-weight: {{d.weight}}">{{d.label}}</span>
        </span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 4px; margin-top: 4px">
      <a href="{{l.map}}" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: {{c.primaryText}}; font-weight: 600; font-size: 15px; text-decoration: none">Clear</a>
      <a href="{{l.map}}" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; color: {{c.primaryText}}; font-weight: 600; font-size: 15px; text-decoration: none">OK</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const light = theme === 'light';
    const c = light
      ? {dialog:'#FFFFFF', text:'#17201A', muted:'#5B6659', border:'#E6E1D5', primary:'#E8691E', primaryText:'#B4500F', band:'#FDEBDD', onPrimary:'#1A0E05'}
      : {dialog:'#1C2920', text:'#EEF1EA', muted:'#A9B5AB', border:'#2C3B30', primary:'#F27B2B', primaryText:'#F7A06A', band:'#3A2516', onPrimary:'#1A0E05'};
    // May 2027 starts on a Saturday; the user's dates: May 18 to 31.
    const days = [];
    for (let i = 0; i < 6; i++) days.push({label: '', bg: 'transparent', color: c.text, weight: 400, band: 'transparent', bandRadius: '0'});
    for (let d = 1; d <= 31; d++) {
      const end = d === 18 || d === 31;
      const inside = d > 18 && d < 31;
      days.push({
        label: String(d),
        bg: end ? c.primary : 'transparent',
        color: end ? c.onPrimary : c.text,
        weight: end ? 600 : 400,
        band: end || inside ? c.band : 'transparent',
        bandRadius: d === 18 ? '999px 0 0 999px' : d === 31 ? '0 999px 999px 0' : '0'
      });
    }
    return {
      theme, c, days,
      weekdays: ['S', 'M', 'T', 'W', 'T', 'F', 'S'],
      l: {map: light ? 'MapLight.dc.html' : 'Main.dc.html'}
    };
  }
}
</script>
</body>
</html>
