<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0 24px 32px; background: {{c.bg}}; color: {{c.text}}; font-family: Barlow, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center">
    <svg width="96" height="128" viewBox="0 0 28 38" role="img" aria-label="GuideHunter"><path d="M14 1.5C7.1 1.5 1.5 7 1.5 13.9 1.5 23 14 36.5 14 36.5S26.5 23 26.5 13.9C26.5 7 20.9 1.5 14 1.5Z" fill="{{c.primary}}"/><g stroke="{{c.deep}}" stroke-width="2.2" stroke-linecap="round"><path d="M8.5 8.5l11 11"/><path d="M19.5 8.5l-11 11"/></g></svg>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.05">Find your hunting or fishing guide</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.45; color: {{c.muted}}">Guides across Canada on one map. Sign in to send requests to guides, or to publish your own offers.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="{{l.choose}}" style="height: 52px; border-radius: 14px; background: {{c.primary}}; color: #1A0E05; font: 600 17px Barlow, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Sign in with Google</a>
    <a href="{{l.map}}" style="height: 48px; border-radius: 14px; color: {{c.green}}; font: 600 17px Barlow, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center">Later</a>
    <span style="font-size: 13px; text-align: center; color: {{c.muted}}">You can sign in anytime from Settings.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    const c = light
      ? {bg:'#F5F2EA', text:'#17201A', muted:'#5B6659', green:'#2F6B3E', primary:'#E8691E', deep:'#1E3B27'}
      : {bg:'#0E1611', text:'#EEF1EA', muted:'#A9B5AB', green:'#8FD19E', primary:'#F27B2B', deep:'#1E3B27'};
    const sfx = light ? 'Light' : '';
    return {c, l: {choose: 'ChooseMode' + sfx + '.dc.html', map: light ? 'MapLight.dc.html' : 'Main.dc.html'}};
  }
}
</script>
</body>
</html>
