<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter map of guides</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FD19E}a:hover{color:#B5E4BF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: Barlow, system-ui, sans-serif; position: relative; overflow: hidden">
  <header style="height: 56px; padding: 6px 8px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <a href="{{l.location}}" aria-label="Show distances from my location" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: {{locateColor}}; background: {{locateBg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></a>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.2px">GuideHunter</span>
    <a href="{{l.form}}" style="height: 44px; padding: 0 12px; display: flex; align-items: center; color: {{c.green}}; font-weight: 600; font-size: 15px; text-decoration: none">Become a guide</a>
  </header>
  <nav aria-label="Filters" style="height: 48px; padding: 0 20px; display: flex; align-items: center; gap: 8px">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
      <a href="{{chip.href}}" style="height: 32px; padding: 0 12px; border-radius: 10px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; color: {{chip.color}}; background: {{chip.bg}}; border: 1px solid {{chip.border}}">
        <sc-if value="{{chip.selected}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
        {{chip.label}}
        <sc-if value="{{chip.menu}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></sc-if>
      </a>
    </sc-for>
  </nav>
  <div style="position: absolute; left: 0; right: 0; top: 104px; bottom: 0; overflow: hidden; background: {{c.land}}">
    <svg width="390" height="740" viewBox="0 0 390 740" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <ellipse cx="212" cy="410" rx="46" ry="34" fill="{{c.park}}"/>
      <ellipse cx="108" cy="372" rx="40" ry="28" fill="{{c.park}}"/>
      <ellipse cx="60" cy="150" rx="34" ry="22" fill="{{c.park}}"/>
      <path d="M0 650 C60 630 130 590 190 545 C230 515 260 480 300 445 L330 470 C290 500 255 535 215 565 C150 615 80 655 0 690 Z" fill="{{c.water}}"/>
      <path d="M300 445 C315 400 300 330 285 280 C275 240 300 170 340 130 L390 110 L390 345 C365 350 345 365 330 395 C325 420 330 450 330 470 Z" fill="{{c.water}}"/>
      <path d="M345 505 C365 492 380 488 390 489 L390 522 C375 517 360 514 345 512 Z" fill="{{c.water}}"/>
      <ellipse cx="345" cy="212" rx="36" ry="9" transform="rotate(-14 345 212)" fill="{{c.land}}"/>
      <ellipse cx="182" cy="290" rx="24" ry="15" fill="{{c.water}}"/>
      <path d="M78 340 C92 326 112 330 120 342 C126 352 112 360 100 356 C90 364 74 356 78 340 Z" fill="{{c.water}}"/>
      <ellipse cx="140" cy="220" rx="10" ry="6" fill="{{c.water}}"/>
      <ellipse cx="250" cy="330" rx="8" ry="12" fill="{{c.water}}"/>
      <ellipse cx="70" cy="420" rx="12" ry="7" fill="{{c.water}}"/>
      <ellipse cx="160" cy="470" rx="9" ry="5" fill="{{c.water}}"/>
      <path d="M0 632 C80 602 140 568 200 514" stroke="{{c.road}}" stroke-width="3" fill="none"/>
      <path d="M70 610 C72 500 62 330 46 200" stroke="{{c.road}}" stroke-width="2.5" fill="none"/>
      <path d="M200 514 C202 440 194 360 196 296" stroke="{{c.road}}" stroke-width="2.5" fill="none"/>
      <path d="M205 512 C255 470 282 425 292 372" stroke="{{c.road}}" stroke-width="2.5" fill="none"/>
      <path d="M330 470 C345 450 365 440 390 438" stroke="{{c.road}}" stroke-width="2.5" fill="none"/>
      <text x="22" y="622" font-family="Barlow, sans-serif" font-size="12" font-weight="600" fill="{{c.mapLabel}}">Montréal</text>
      <text x="150" y="540" font-family="Barlow, sans-serif" font-size="12" font-weight="600" fill="{{c.mapLabel}}">Québec</text>
      <text x="210" y="262" font-family="Barlow, sans-serif" font-size="12" font-weight="600" fill="{{c.mapLabel}}">Saguenay</text>
      <text x="338" y="458" font-family="Barlow, sans-serif" font-size="12" font-weight="600" fill="{{c.mapLabel}}">Gaspé</text>
      <text x="16" y="236" font-family="Barlow, sans-serif" font-size="12" font-weight="600" fill="{{c.mapLabel}}">Abitibi</text>
      <text x="300" y="250" font-family="Barlow, sans-serif" font-size="11" font-style="italic" fill="{{c.mapLabel}}">Gulf of St. Lawrence</text>
    </svg>
    <sc-if value="{{showUser}}" hint-placeholder-val="{{ false }}">
      <span aria-label="You are here" role="img" style="position: absolute; left: 189px; top: 504px; width: 32px; height: 32px; border-radius: 999px; background: {{c.youHalo}}; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 999px; background: {{c.you}}; border: 2.5px solid #FFFFFF"></span></span>
    </sc-if>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="7">
      <a href="{{l.sheet}}" aria-label="{{p.title}}" style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: 44px; height: 44px; display: flex; align-items: flex-end; justify-content: center"><svg width="28" height="38" viewBox="0 0 28 38" aria-hidden="true"><path d="M14 1.5C7.1 1.5 1.5 7 1.5 13.9 1.5 23 14 36.5 14 36.5S26.5 23 26.5 13.9C26.5 7 20.9 1.5 14 1.5Z" fill="{{p.color}}" stroke="{{c.pinStroke}}" stroke-width="1.5"/><circle cx="14" cy="14" r="4.5" fill="{{c.pinDot}}"/></svg></a>
    </sc-for>
    <div style="position: absolute; left: 0; right: 0; bottom: 20px; display: flex; flex-direction: column; gap: 8px">
      <span style="align-self: flex-start; margin-left: 20px; padding: 4px 12px; border-radius: 999px; background: {{c.card}}; border: 1px solid {{c.border}}; font-size: 14px; font-weight: 600">{{count}}</span>
      <div style="display: flex; gap: 12px; padding-left: 20px">
        <sc-for list="{{cards}}" as="g" hint-placeholder-count="2">
          <a href="{{l.sheet}}" style="flex: 0 0 240px; box-sizing: border-box; background: {{c.card}}; border: 1px solid {{c.border}}; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: {{c.text}}; box-shadow: {{c.shadow}}">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: {{g.kindColor}}">{{g.kind}}</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.title}}</span>
            <span style="font-size: 13px; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.sub}}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"mode":{"editor":"enum","options":["all","fish","near"],"default":"all"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const mode = this.props.mode ?? 'all';
    const light = theme === 'light';
    const P = {
      dark: {bg:'#0E1611',card:'#17221A',text:'#EEF1EA',muted:'#A9B5AB',green:'#8FD19E',greenTint:'#22382A',label:'#F7A06A',border:'#24352A',outline:'#2C3B30',land:'#18231C',water:'#0F2A33',park:'#1C3022',road:'#2B3B31',mapLabel:'#8C998E',hunt:'#F27B2B',fish:'#4FB3A0',both:'#E9C25A',pinStroke:'#0E1611',pinDot:'#0E1611',you:'#6EA8FF',youHalo:'rgba(110,168,255,0.28)',shadow:'0 6px 18px rgba(0,0,0,0.45)'},
      light: {bg:'#F5F2EA',card:'#FFFFFF',text:'#17201A',muted:'#5B6659',green:'#2F6B3E',greenTint:'#E3EFE4',label:'#B4500F',border:'#E6E1D5',outline:'#DDD7C8',land:'#EDEAE1',water:'#B7D5E3',park:'#D5E6CC',road:'#FFFFFF',mapLabel:'#5F665C',hunt:'#E8691E',fish:'#1F7A6A',both:'#C99A12',pinStroke:'#FFFFFF',pinDot:'#FFFFFF',you:'#2563EB',youHalo:'rgba(37,99,235,0.2)',shadow:'0 6px 18px rgba(23,32,26,0.16)'}
    };
    const c = P[light ? 'light' : 'dark'];
    const s = light ? 'Light' : '';
    const link = (n) => (n === 'map' ? (light ? 'MapLight' : 'Main') : n + s) + '.dc.html';
    const l = {map: link('map'), near: link('MapNear'), species: link('SpeciesPicker'), location: link('LocationAsk'), sheet: link('GuideSheet'), form: link('Form')};
    const guides = [
      {id:'bear', act:'HUNT', title:'Black bear over bait', region:'Abitibi-Témiscamingue', km:600, x:46, y:206},
      {id:'walleye', act:'FISH', title:'Walleye on Lac Saint-Jean', region:'Saguenay–Lac-Saint-Jean', km:205, x:192, y:268},
      {id:'moose', act:'BOTH', title:'Moose by canoe, walleye in summer', region:'Haute-Mauricie', km:230, x:118, y:362},
      {id:'trout', act:'FISH', title:'Brook trout, fly-in lakes', region:'Laurentides', km:60, x:214, y:420},
      {id:'goose', act:'HUNT', title:'Snow geese at Cap-Tourmente', region:'Côte-de-Beaupré', km:45, x:246, y:486},
      {id:'deer', act:'HUNT', title:'White-tailed deer on Anticosti', region:'Anticosti Island', km:650, x:340, y:206},
      {id:'salmon', act:'FISH', title:'Atlantic salmon, Gaspé rivers', region:'Gaspé', km:610, x:362, y:412}
    ];
    const kinds = {HUNT: 'Hunting', FISH: 'Fishing', BOTH: 'Hunting and fishing'};
    const colors = {HUNT: c.hunt, FISH: c.fish, BOTH: c.both};
    let shown = mode === 'fish' ? guides.filter(g => g.act !== 'HUNT') : guides;
    if (mode === 'near') shown = [...shown].sort((a, b) => a.km - b.km);
    const pins = shown.map(g => ({title: g.title, color: colors[g.act], left: g.x - 22, top: g.y - 42}));
    const cards = shown.slice(0, 3).map(g => ({
      title: g.title,
      kind: kinds[g.act],
      kindColor: g.act === 'FISH' ? c.green : c.label,
      sub: mode === 'near' ? g.region + ' · About ' + g.km + ' km from you' : g.region
    }));
    const chip = (label, selected, href, menu) => ({
      label, selected, href, menu,
      color: selected ? c.green : c.text,
      bg: selected ? c.greenTint : 'transparent',
      border: selected ? c.greenTint : c.outline
    });
    const chips = [
      chip('All', mode !== 'fish', link('map'), false),
      chip('Hunting', false, link('map'), false),
      chip('Fishing', mode === 'fish', link('SpeciesPicker'), false),
      chip('Species', false, link('SpeciesPicker'), true)
    ];
    return {
      c, l, chips, pins, cards,
      count: shown.length + ' guides',
      showUser: mode === 'near',
      locateColor: mode === 'near' ? c.green : c.text,
      locateBg: mode === 'near' ? c.greenTint : 'transparent'
    };
  }
}
</script>
</body>
</html>
