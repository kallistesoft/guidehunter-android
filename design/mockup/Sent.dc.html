<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter application sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: Barlow, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; padding: 8px 8px 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px">
    <a href="{{mapHref}}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: {{c.text}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px">Become a guide</span>
  </header>
  <div style="flex: 1; padding: 0 24px 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
    <span style="width: 96px; height: 96px; border-radius: 999px; background: {{c.greenTint}}; color: {{c.green}}; display: flex; align-items: center; justify-content: center"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Application sent</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: {{c.muted}}">Thank you! We’ll review your offer and reply by email before it goes on the map.</p>
    <a href="{{mapHref}}" style="align-self: stretch; margin-top: 12px; height: 52px; border-radius: 14px; background: {{c.primary}}; color: #1A0E05; font: 600 17px Barlow, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center">Back to the map</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    const c = light
      ? {bg:'#F5F2EA', text:'#17201A', muted:'#5B6659', green:'#2F6B3E', greenTint:'#E3EFE4', primary:'#E8691E'}
      : {bg:'#0E1611', text:'#EEF1EA', muted:'#A9B5AB', green:'#8FD19E', greenTint:'#22382A', primary:'#F27B2B'};
    return {c, mapHref: light ? 'MapLight.dc.html' : 'Main.dc.html'};
  }
}
</script>
</body>
</html>
