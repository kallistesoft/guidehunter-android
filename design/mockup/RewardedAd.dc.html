<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter rewarded ad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Barlow, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="height: 64px; padding: 12px 16px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.16); display: flex; align-items: center; font-size: 14px; font-weight: 600">Reward in 12 seconds</span>
    <a href="{{l.notEarned}}" aria-label="Close the ad" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px">
    <span style="width: 300px; height: 250px; border: 1.5px dashed rgba(255,255,255,0.4); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; color: rgba(255,255,255,0.75); padding: 16px; box-sizing: border-box">[Advertiser’s video, served by AdMob]</span>
    <span style="font-size: 13px; color: rgba(255,255,255,0.7); text-align: center; max-width: 280px">Watch to the end to see the guide’s contact. Closing early shows nothing.</span>
  </div>
  <div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px">
    <div aria-hidden="true" style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2)"><div style="width: 60%; height: 4px; border-radius: 999px; background: #FFFFFF"></div></div>
    <a href="{{l.unlocked}}" style="height: 52px; border-radius: 14px; background: #FFFFFF; color: #000000; font: 600 16px Barlow, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center">Watched to the end →</a>
    <a href="{{l.offline}}" style="align-self: center; font-size: 13px; color: rgba(255,255,255,0.75); padding: 8px">No network? →</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sfx = (this.props.theme ?? 'dark') === 'light' ? 'Light' : '';
    return {
      l: {
        unlocked: 'SheetUnlocked' + sfx + '.dc.html',
        notEarned: 'SheetNotEarned' + sfx + '.dc.html',
        offline: 'SheetOffline' + sfx + '.dc.html'
      }
    };
  }
}
</script>
</body>
</html>
