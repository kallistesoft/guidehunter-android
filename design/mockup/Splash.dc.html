<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter splash screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<a href="{{mapHref}}" aria-label="Open the map" style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
  <svg width="168" height="168" viewBox="18 18 72 72" role="img" aria-label="GuideHunter">
    <!-- The hook pin (Logo.dc.html), on the adaptive icon's 108 grid. -->
    <g transform="translate(0 -3)" fill="#F27B2B" stroke="#F27B2B">
      <path fill-rule="evenodd" stroke="none" d="M54 23 C44.6 23 37 30.6 37 40 C37 51 50 62 54 68 C58 62 71 51 71 40 C71 30.6 63.4 23 54 23 Z M48 40 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 Z"/>
      <path d="M54 62 L54 76 A9 9 0 0 1 36 76 L36 72" fill="none" stroke-width="5"/>
      <path d="M33.5 73 L37.5 64 L38.5 73 Z" stroke="none"/>
      <path d="M38.2 67.5 L42.5 72.5 L38.4 71.5 Z" stroke="none"/>
    </g>
  </svg>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    return {
      bg: light ? '#2D5B38' : '#1F4229',
      mapHref: light ? 'MapLight.dc.html' : 'Main.dc.html'
    };
  }
}
</script>
</body>
</html>
