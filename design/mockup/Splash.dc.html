<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter splash screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<a href="{{mapHref}}" aria-label="Open the map" style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
  <svg width="168" height="168" viewBox="0 0 168 168" role="img" aria-label="GuideHunter">
    <circle cx="84" cy="84" r="66" fill="{{disc}}"/>
    <path d="M84 34C66 34 52 48 52 66c0 24 32 62 32 62s32-38 32-62c0-18-14-32-32-32Z" fill="#F27B2B"/>
    <circle cx="84" cy="66" r="13" fill="{{disc}}"/>
    <path d="M60 136h48" stroke="#F7F2EA" stroke-width="5" stroke-linecap="round"/>
  </svg>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    return {
      bg: light ? '#2D5B38' : '#1F4229',
      disc: light ? '#1F4229' : '#17331F',
      mapHref: light ? 'MapLight.dc.html' : 'Main.dc.html'
    };
  }
}
</script>
</body>
</html>
