<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuideHunter fishing species picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Barlow, system-ui, sans-serif">
  <dc-import name="Main" theme="{{theme}}" mode="fish" hint-size="390px,844px"></dc-import>
  <div role="menu" aria-label="Species" style="position: absolute; left: 150px; top: 98px; width: 224px; background: {{c.menu}}; border-radius: 14px; padding: 6px 0; box-shadow: {{c.shadow}}; display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="15">
      <a role="menuitemcheckbox" aria-checked="{{it.on}}" href="{{mapHref}}" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; text-decoration: none; color: {{c.text}}; font-weight: {{it.weight}}">
        <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px; box-sizing: border-box; border: 2px solid {{it.box}}; background: {{it.fill}}; display: flex; align-items: center; justify-content: center; color: {{c.onPrimary}}"><sc-if value="{{it.on}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>{{it.label}}
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const light = theme === 'light';
    const c = light
      ? {menu:'#FFFFFF', text:'#17201A', muted:'#5B6659', primary:'#E8691E', onPrimary:'#1A0E05', shadow:'0 10px 30px rgba(23,32,26,0.22)'}
      : {menu:'#1C2920', text:'#EEF1EA', muted:'#A9B5AB', primary:'#F27B2B', onPrimary:'#1A0E05', shadow:'0 10px 30px rgba(0,0,0,0.55)'};
    // Several species can be ticked; the menu stays open. Fishing chosen: one alphabetical list, no headings.
    const names = ['Any species', 'Arctic char', 'Atlantic salmon', 'Brook trout', 'Ice fishing', 'Lake trout', 'Largemouth bass', 'Muskellunge', 'Northern pike', 'Pacific salmon', 'Rainbow trout', 'Smallmouth bass', 'Sturgeon', 'Walleye', 'Yellow perch'];
    const ticked = ['Brook trout', 'Walleye'];
    const items = names.map((label, i) => {
      const on = ticked.includes(label);
      return {label, on, weight: i === 0 ? 600 : 400, box: on ? c.primary : c.muted, fill: on ? c.primary : 'transparent'};
    });
    return {theme, c, items, mapHref: light ? 'MapLight.dc.html' : 'Main.dc.html'};
  }
}
</script>
</body>
</html>
